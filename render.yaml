services:
  - type: web
    name: patient-voice-registration
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: MONGODB_URI
        sync: false
      - key: VAPI_SERVER_SECRET
        sync: false
