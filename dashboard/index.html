<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Patient Registration Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: light; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #f6f7f9; color: #1a1d23; }
  header { background: #12213f; color: #fff; padding: 20px 24px; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; font-size: 13px; color: #9db0d6; }
  main { padding: 24px; max-width: 1100px; margin: 0 auto; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar input { padding: 8px 10px; border: 1px solid #d0d5dd; border-radius: 6px; font-size: 14px; min-width: 160px; }
  .toolbar button { padding: 8px 14px; border-radius: 6px; border: none; background: #2952e3; color: #fff; cursor: pointer; font-size: 14px; }
  .toolbar button:hover { background: #1e3fc4; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  th, td { text-align: left; padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #eef0f3; }
  th { background: #eef1f6; font-weight: 600; color: #3a4150; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; background: #e6f4ea; color: #1e7b34; }
  .empty { padding: 40px; text-align: center; color: #7c8494; }
  .patient-id { font-family: ui-monospace, monospace; font-size: 11px; color: #7c8494; }
  .err { color: #b42318; font-size: 13px; margin-bottom: 12px; }
</style>
</head>
<body>
<header>
  <h1>Patient Registration Dashboard</h1>
  <p>Live view of patients registered via the phone voice agent and the REST API</p>
</header>
<main>
  <div class="toolbar">
    <input id="filterLastName" placeholder="Filter by last name" />
    <input id="filterPhone" placeholder="Filter by phone number" />
    <button id="searchBtn">Search</button>
    <button id="refreshBtn">Refresh</button>
  </div>
  <div id="errorBox" class="err"></div>
  <table id="patientTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>DOB</th>
        <th>Sex</th>
        <th>Phone</th>
        <th>City/State</th>
        <th>Insurance</th>
        <th>Registered</th>
        <th>Patient ID</th>
      </tr>
    </thead>
    <tbody id="patientBody"></tbody>
  </table>
</main>
<script>
  const body = document.getElementById('patientBody');
  const errorBox = document.getElementById('errorBox');

  async function loadPatients() {
    errorBox.textContent = '';
    const lastName = document.getElementById('filterLastName').value.trim();
    const phone = document.getElementById('filterPhone').value.trim();
    const params = new URLSearchParams();
    if (lastName) params.set('last_name', lastName);
    if (phone) params.set('phone_number', phone);

    try {
      const res = await fetch('/patients?' + params.toString());
      const json = await res.json();
      if (json.error) throw new Error(json.error.message || 'Request failed');
      render(json.data || []);
    } catch (err) {
      errorBox.textContent = 'Failed to load patients: ' + err.message;
      body.innerHTML = '';
    }
  }

  function render(patients) {
    if (!patients.length) {
      body.innerHTML = '<tr><td colspan="8" class="empty">No patients found</td></tr>';
      return;
    }
    body.innerHTML = patients.map(p => `
      <tr>
        <td>${escapeHtml(p.first_name)} ${escapeHtml(p.last_name)}</td>
        <td>${escapeHtml(p.date_of_birth)}</td>
        <td>${escapeHtml(p.sex)}</td>
        <td>${formatPhone(p.phone_number)}</td>
        <td>${escapeHtml(p.city)}, ${escapeHtml(p.state)}</td>
        <td>${p.insurance_provider ? '<span class="badge">' + escapeHtml(p.insurance_provider) + '</span>' : '—'}</td>
        <td>${p.created_at ? new Date(p.created_at).toLocaleString() : '—'}</td>
        <td class="patient-id">${escapeHtml(p.patient_id)}</td>
      </tr>
    `).join('');
  }

  function formatPhone(digits) {
    if (!digits || digits.length !== 10) return escapeHtml(digits || '');
    return `(${digits.slice(0,3)}) ${digits.slice(3,6)}-${digits.slice(6)}`;
  }

  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  document.getElementById('searchBtn').addEventListener('click', loadPatients);
  document.getElementById('refreshBtn').addEventListener('click', loadPatients);
  loadPatients();
</script>
</body>
</html>
